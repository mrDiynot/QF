<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A3C"/>
      <stop offset="100%" style="stop-color:#E85D04"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bgGradient)"/>
  
  <!-- Q letter stylized as flow/funnel -->
  <g transform="translate(200, 180)">
    <!-- Main Q circle -->
    <circle cx="312" cy="280" r="220" stroke="white" stroke-width="70" fill="none"/>
    
    <!-- Q tail as flowing arrow -->
    <path d="M450 400 L580 530 L520 530 L520 620 L460 620 L460 530 L400 530 Z" 
          fill="white"/>
    
    <!-- Flow lines inside Q -->
    <path d="M200 200 Q312 150 424 200" stroke="white" stroke-width="25" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M180 280 Q312 230 444 280" stroke="white" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M200 360 Q312 310 424 360" stroke="white" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Small decorative dots representing leads/data flow -->
  <circle cx="750" cy="200" r="25" fill="white" opacity="0.8"/>
  <circle cx="820" cy="280" r="18" fill="white" opacity="0.6"/>
  <circle cx="780" cy="350" r="12" fill="white" opacity="0.4"/>
</svg>

