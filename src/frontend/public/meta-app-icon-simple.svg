<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A3C"/>
      <stop offset="50%" style="stop-color:#F85D18"/>
      <stop offset="100%" style="stop-color:#E84A05"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  
  <!-- Stylized "Q" mark -->
  <g transform="translate(512, 480)">
    <!-- Main circle of Q -->
    <circle cx="0" cy="0" r="240" stroke="white" stroke-width="80" fill="none"/>
    
    <!-- Diagonal tail of Q extending to bottom right -->
    <rect x="100" y="120" width="80" height="280" rx="40" fill="white" transform="rotate(45 140 260)"/>
  </g>
  
  <!-- Three horizontal flow lines inside the Q -->
  <rect x="340" y="340" width="344" height="40" rx="20" fill="white" opacity="0.5"/>
  <rect x="300" y="420" width="424" height="50" rx="25" fill="white" opacity="0.7"/>
  <rect x="340" y="510" width="344" height="40" rx="20" fill="white" opacity="0.5"/>
</svg>

